name: Build ImmortalWrt v25.12.1 Streamlined for NanoPi R3S

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build workspace'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-immortalwrt.yml'
      - 'immortalwrt-rk3566.config'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.1
  CONFIG_FILE: immortalwrt-rk3566.config
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison yasm acl gettext libncurses-dev \
          libssl-dev python3-setuptools python3-pyelftools python3-dev rsync unzip zlib1g-dev file snapd zstd lz4 git
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt v25.12.1 Source Code
      working-directory: /workdir
      run: |
        df -h
        git clone $REPO_URL -b $REPO_TAG --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Feeds & OpenClash Custom Package
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 导入 OpenClash 官方最新仓库
        git clone https://github.com/vernesong/OpenClash.git package/custom/luci-app-openclash

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration & Files Overlay
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        [ -d files ] && cp -r files openwrt/files
        cd openwrt
        make defconfig

    - name: Download Package Source Files
      working-directory: /workdir/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} +

    - name: Compile ImmortalWrt Firmware
      id: compile
      working-directory: /workdir/openwrt
      run: |
        echo "Starting parallel compilation with -j$(nproc)..."
        make -j$(nproc) V=s || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Firmware Files
      if: steps.compile.outputs.status == 'success'
      working-directory: /workdir/openwrt
      run: |
        cd bin/targets/rockchip/armv8/
        rm -rf *.buildinfo *.manifest sha256sums
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware to Artifacts
      if: steps.compile.outputs.status == 'success' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_v25.12.1_NanoPi_R3S_Streamlined
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: Create GitHub Release
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ImmortalWrt-v25.12.1-NanoPi-R3S-${{ github.run_id }}
        name: ImmortalWrt v25.12.1 NanoPi R3S 极简版固件发布
        body: |
          🎉 **ImmortalWrt v25.12.1 NanoPi R3S 极简版固件发布！**
          - 目标硬件: NanoPi R3S / Rockchip RK3566
          - 源码版本: ImmortalWrt v25.12.1 (最新 Release)
          - 精简插件: LuCI 简体中文、OpenClash、Tailscale (WireGuard)、ttyd (网页终端)
          - 默认后台: 192.168.1.1 (密码空)
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

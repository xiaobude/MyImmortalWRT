name: Build ImmortalWrt Streamlined for NanoPi R2S (RK3328)

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build workspace'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-immortalwrt.yml'
      - 'immortalwrt-rk3328.config'
      - 'files/**'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.1
  CONFIG_FILE: immortalwrt-rk3328.config
  DEVICE_PROFILE: friendlyarm_nanopi-r2s
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    # 与最近两次成功构建(run 5/6)保持同一 runner; ubuntu-24.04 待镜像能出后再单独验证
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison yasm acl gettext \
          libncurses-dev libssl-dev libelf-dev device-tree-compiler python3-setuptools \
          python3-pyelftools python3-dev rsync unzip zlib1g-dev file snapd zstd lz4 \
          git time
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt Source Code
      working-directory: /workdir
      run: |
        df -h
        git clone $REPO_URL -b $REPO_TAG --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Feeds
      working-directory: /workdir/openwrt
      run: |
        # feeds.conf.default 按 commit 锁定版本; luci-app-openclash 由 immortalwrt/luci 直接提供,
        # 不需要再 clone vernesong/OpenClash
        ./scripts/feeds update -a
        # 移除损坏的 rust 包 (其上游 ci-artifacts 404 导致构建崩溃，且本精简固件无需 rust)
        rm -rf feeds/packages/lang/rust
        ./scripts/feeds install -a

    - name: Load Custom Configuration & Files Overlay
      run: |
        # 修复 Linux 6.12 内核缺少 ums-alauda 等驱动导致的 kmod-usb-storage-extras 校验报错
        sed -i '/kmod-usb-storage-extras/d' openwrt/package/emortal/automount/Makefile 2>/dev/null || true
        sed -i '/define KernelPackage\/usb-storage-extras/,/endef/d' openwrt/package/kernel/linux/modules/usb.mk 2>/dev/null || true
        sed -i '/KernelPackage,usb-storage-extras/d' openwrt/package/kernel/linux/modules/usb.mk 2>/dev/null || true

        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        [ -d files ] && cp -r files openwrt/files
        cd openwrt
        make defconfig
        sed -i 's/CONFIG_PACKAGE_kmod-usb-storage-extras=y/# CONFIG_PACKAGE_kmod-usb-storage-extras is not set/g' .config
        sed -i 's/CONFIG_PACKAGE_kmod-usb-storage-extras=m/# CONFIG_PACKAGE_kmod-usb-storage-extras is not set/g' .config
        sed -i 's/CONFIG_PACKAGE_rust=y/# CONFIG_PACKAGE_rust is not set/g' .config
        sed -i 's/CONFIG_PACKAGE_rust=m/# CONFIG_PACKAGE_rust is not set/g' .config
        # profile 符号名若与源码树不符, defconfig 会静默丢弃它并编译别的板型
        grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_${DEVICE_PROFILE}=y" .config || {
          echo "::error::DEVICE profile ${DEVICE_PROFILE} 未被选中, 请核对 REPO_TAG 对应源码树里的板型符号名"
          exit 1
        }
        # 包符号不存在时 defconfig 同样静默丢弃 -> 构建成功但固件缺功能, 所以逐个验明
        for sym in CONFIG_PACKAGE_luci CONFIG_PACKAGE_luci-app-openclash \
                   CONFIG_PACKAGE_ttyd CONFIG_PACKAGE_luci-app-ttyd CONFIG_PACKAGE_tailscale; do
          grep -q "^${sym}=y" .config || {
            echo "::error::$sym 未进入 .config: 该包在此 feeds 版本里不存在或已改名"
            exit 1
          }
        done

    - name: Download Package Source Files
      working-directory: /workdir/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} +

    - name: Compile ImmortalWrt Firmware
      id: compile
      working-directory: /workdir/openwrt
      run: |
        echo "Starting parallel compilation with -j$(nproc)..."
        if make -j$(nproc) V=s > /tmp/build.log 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "并行构建失败, 单核重跑以定位具体出错的包"
          if make -j1 V=s >> /tmp/build.log 2>&1; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            tail -c 4000 /tmp/build.log
            exit 1
          fi
        fi

    - name: Report Failure Cause
      if: failure()
      working-directory: /workdir/openwrt
      run: |
        # 日志接口需要认证, 但 annotations 是公开可读的: 把失败原因塞进 ::error:: 消息里
        {
          echo "== 磁盘 =="; df -h /workdir | tail -1
          echo "== 内存 =="; free -m | head -2
          echo "== 出错位置 =="
          grep -nE "Error [0-9]+$|\*\*\*|failed to build|No space left|out of memory|Killed|cannot find|not found" /tmp/build.log | tail -45
        } > /tmp/diag.txt
        msg=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g' -e 's/\r//g' /tmp/diag.txt)
        echo "::error::$msg"

    - name: Upload Build Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-run${{ github.run_number }}
        path: /tmp/build.log
        retention-days: 7

    - name: Verify Images Have A Partition Table
      working-directory: /workdir/openwrt
      run: |
        cd bin/targets/rockchip/armv8/
        shopt -s nullglob
        imgs=(*${DEVICE_PROFILE}*.img.gz)
        if [ ${#imgs[@]} -eq 0 ]; then
          echo "::error::没有产出 ${DEVICE_PROFILE} 的镜像, 检查板型符号名与 .config"
          exit 1
        fi
        for img in "${imgs[@]}"; do
          if zcat "$img" | head -c 2097152 | grep -qa 'EFI PART'; then
            echo "OK  $img (含 GPT 分区表)"
          else
            echo "::error::$img 无分区表, 镜像不可启动"
            exit 1
          fi
        done

    - name: Organize Firmware Files
      if: steps.compile.outputs.status == 'success'
      working-directory: /workdir/openwrt
      run: |
        cd bin/targets/rockchip/armv8/
        rm -f *.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware to Artifacts
      if: steps.compile.outputs.status == 'success' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_NanoPi_R2S_RK3328_Streamlined
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: Create GitHub Release
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ImmortalWrt-NanoPi-R2S-RK3328-${{ github.run_id }}
        name: ImmortalWrt NanoPi R2S (RK3328) 精简版固件发布
        body: |
          🎉 **ImmortalWrt NanoPi R2S 精简版固件发布！**
          - 目标硬件: FriendlyElec NanoPi R2S / Rockchip RK3328 (1GB RAM)
          - 源码版本: ${{ env.REPO_TAG }}
          - 插件: LuCI 简体中文、OpenClash、Tailscale (WireGuard)、ttyd (网页终端)
          - 默认后台: http://192.168.2.1 (用户 root, 密码空)
          - 网口: LAN = eth1 (USB RTL8153), WAN = eth0 (GMAC)
          - 烧录: TF 卡用 balenaEtcher 直接烧 squashfs 或 ext4 的 sysupgrade .img.gz
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
